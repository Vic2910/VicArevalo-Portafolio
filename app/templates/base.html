<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Perfil público{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header"><div class="shell"><p class="brand">Portafolio <span>· Perfil público</span></p>
    <nav aria-label="Navegación principal">{% block navigation %}{% endblock %}</nav>
  </div></header>
  <main id="contenido" class="shell" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="shell"><p>Perfil, conocimientos y experiencia académica.</p></footer>
</body>
</html>
